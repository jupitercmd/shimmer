# editions.minecraftVersion is the exact version string passed to Modrinth's
# game_versions filter. "full" targets 26.1.2 rather than something older,
# since that's the newest version that still covers Particle Rain, Cave Dust,
# Atmospheric Fauna, and the original Particular together — mods like
# Effective (capped 1.21.1) and Wakes (capped 1.21.11) don't share a common
# floor with those, so they're left out even in Full, covered by their
# stand-ins instead.

editions:
  full:
    name: Full
    minecraftVersion: "26.1.2"
    loader: fabric
    summary: Every mod, including ones not yet ported to 26.2

  latest:
    name: Latest
    minecraftVersion: "26.2"
    loader: fabric
    summary: Current version, ~75% of mods, alternatives swapped in where needed

  full-iris:
    name: Full (Iris)
    minecraftVersion: "26.1.2"
    loader: fabric
    summary: Full edition, Iris-compatible mods only, ships with Iris

  latest-iris:
    name: Latest (Iris)
    minecraftVersion: "26.2"
    loader: fabric
    summary: Latest edition, Iris-compatible mods only, ships with Iris

mods:
  - id: sodium
    editions: [full, latest, full-iris, latest-iris]
